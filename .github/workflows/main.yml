name: Run Smart Crawler image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker image (empty = repository variable/default)"
        type: string
        default: ""
      threads:
        description: "Worker threads"
        type: string
        default: "3"
      run_key:
        description: "Keep unchanged to resume; change to start a new crawl"
        type: string
        default: smart-national-v3
      auto_restart:
        description: "Continue after each five-hour crawl cycle"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: smart-crawl-${{ github.repository }}-${{ inputs.run_key || 'smart-national-v3' }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # First start also downloads the latest PBF and creates the queue.
    timeout-minutes: 360
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'vance93sneed9011' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull crawler image
        id: image
        timeout-minutes: 10
        env:
          IMAGE: ${{ inputs.image || vars.SMART_CRAWLER_IMAGE || 'vance93sneed9011/smart-crawler-v6:latest' }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          [[ "$DIGEST" == *@sha256:* ]]
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run crawler (automatically create or resume queue)
        id: cycle
        timeout-minutes: 345
        env:
          VERIFY_POSTGRES_URI: ${{ secrets.VERIFY_POSTGRES_URI }}
          SMART_CRAWLER_PBF_URL: ${{ vars.SMART_CRAWLER_PBF_URL }}
          IMAGE: ${{ steps.image.outputs.image }}
          INPUT_THREADS: ${{ inputs.threads || '3' }}
          INPUT_RUN_KEY: ${{ inputs.run_key || 'smart-national-v3' }}
        run: |
          set -euo pipefail
          test -n "$VERIFY_POSTGRES_URI" || { echo 'VERIFY_POSTGRES_URI secret is required.' >&2; exit 1; }
          echo 'restart=false' >> "$GITHUB_OUTPUT"
          CONTAINER="smart-crawl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker stop --time 90 "$CONTAINER" >/dev/null 2>&1 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          set +e
          timeout --signal=TERM --kill-after=90s 340m \
            docker run --name "$CONTAINER" --init --stop-timeout 90 \
              -e VERIFY_POSTGRES_URI -e SMART_CRAWLER_PBF_URL "$IMAGE" \
              --threads "$INPUT_THREADS" --run-key "$INPUT_RUN_KEY" \
              --max-runtime-minutes 300 --report /app/out/crawl-cycle.json
          CRAWLER_EXIT=$?
          set -e
          docker stop --time 90 "$CONTAINER" >/dev/null 2>&1 || true
          docker cp "$CONTAINER:/app/out/crawl-cycle.json" crawl-cycle.json
          test "$CRAWLER_EXIT" -eq 0
          jq -e '.schema_version == 1 and .exit_code == 0 and (.run_id > 0)' crawl-cycle.json >/dev/null
          if jq -e '.restart_eligible == true and .reason == "cycle_limit" and .state == "running"
              and ((.counts.blocked // 0) == 0) and ((.counts.failed_permanent // 0) == 0)' crawl-cycle.json >/dev/null; then
            echo 'restart=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-crawl-${{ github.run_id }}-${{ github.run_attempt }}
          path: crawl-cycle.json
          if-no-files-found: warn
          retention-days: 14

      - name: Trigger next five-hour cycle
        if: ${{ !cancelled() && steps.cycle.outputs.restart == 'true' && inputs.auto_restart == 'true' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          INPUT_THREADS: ${{ inputs.threads || '3' }}
          INPUT_RUN_KEY: ${{ inputs.run_key || 'smart-national-v3' }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          WORKFLOW_PATH="${WORKFLOW_REF#${REPO}/}"
          WORKFLOW_FILE="${WORKFLOW_PATH%@*}"
          WORKFLOW_FILE="${WORKFLOW_FILE##*/}"
          jq -n --arg ref "$REF" --arg threads "$INPUT_THREADS" \
            --arg run_key "$INPUT_RUN_KEY" --arg image "$IMAGE" \
            '{ref: $ref, inputs: {threads: $threads, run_key: $run_key,
              image: $image, auto_restart: "true"}}' > "$RUNNER_TEMP/smart-dispatch.json"
          gh api --method POST "repos/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
            --input "$RUNNER_TEMP/smart-dispatch.json"
